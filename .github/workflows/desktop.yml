# The Windows app as a zip: unzip it anywhere and run Piano.exe. No
# installer, nothing to set up (Windows 10 and 11 already have WebView2).
# It's portable: its data goes in a Data folder beside it, and it updates
# itself from the latest release.
#
# A merge to main whose APP_VERSION has no app-v<version> release yet is a
# release: it builds, signs and publishes app-v<version> with the zip,
# Piano.exe and Piano.exe.sig (what the in-app updater fetches). Other
# merges don't build. Run by hand (Actions → Windows app → Run workflow) it
# only leaves artifacts. The run's artifact is the Piano folder itself:
# GitHub zips every artifact, so uploading the zip would put a zip inside
# the download.
name: Windows app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.g.outputs.build }}
      release: ${{ steps.g.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: g
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="$(node -p "require('./tools/build-www').appVersion()")"
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"; echo "release=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/app-v$V" >/dev/null 2>&1; then
            echo "app-v$V is already released: this merge isn't a release, so no build"
            echo "build=false" >> "$GITHUB_OUTPUT"; echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"; echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  tests:
    needs: gate
    if: needs.gate.outputs.build == 'true'
    uses: ./.github/workflows/tests.yml

  build:
    needs: [gate, tests]
    runs-on: windows-latest
    env:
      HAS_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Icons
        run: npx tauri icon icon.svg

      # The version comes from APP_VERSION. --no-bundle: the plain .exe,
      # with the app's files built in, which is all a zip needs.
      - name: Build
        shell: bash
        run: |
          V="$(node -p "require('./tools/build-www').appVersion()")"
          echo "V=$V" >> "$GITHUB_ENV"
          npx tauri build --ci --no-bundle --config "{\"version\":\"$V\"}"

      - name: Zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out/Piano | Out-Null
          Copy-Item src-tauri/target/release/piano.exe out/Piano/Piano.exe
          Copy-Item README.md out/Piano/README.md
          Compress-Archive -Path out/Piano -DestinationPath "out/Piano-$env:V-windows.zip"

      # The portable updater (src-tauri/src/portable.rs) installs only a
      # Piano.exe that carries this signature. A release attaches Piano.exe
      # and Piano.exe.sig beside the zip.
      - name: Sign for the updater
        if: env.HAS_KEY == 'true'
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        # A secret piped in from Windows PowerShell can start with a byte
        # order mark and end with a line break; neither is part of the key.
        run: |
          if [ ! -s src-tauri/updater.pub ]; then echo "::warning::src-tauri/updater.pub is empty: this build can't check updates"; fi
          clean() { local v="${1#$'\xEF\xBB\xBF'}"; v="${v%$'\n'}"; printf '%s' "${v%$'\r'}"; }
          export TAURI_SIGNING_PRIVATE_KEY="$(clean "$TAURI_SIGNING_PRIVATE_KEY")"
          export TAURI_SIGNING_PRIVATE_KEY_PASSWORD="$(clean "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD")"
          mkdir -p out/update
          cp out/Piano/Piano.exe out/update/Piano.exe
          npx tauri signer sign out/update/Piano.exe

      - uses: actions/upload-artifact@v4
        with:
          name: Piano-${{ env.V }}-windows
          path: out/Piano/

      - uses: actions/upload-artifact@v4
        if: env.HAS_KEY == 'true'
        with:
          name: Piano-${{ env.V }}-update
          path: out/update/

      # A release without a signed Piano.exe would never reach the updater.
      - name: Publish the release
        if: needs.gate.outputs.release == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$HAS_KEY" != true ]; then echo "::error::No signing key: a release needs Piano.exe.sig"; exit 1; fi
          awk -v h="## [$V]" 'index($0,h)==1{on=1;next} on&&/^## /{exit} on' CHANGELOG.md > notes.md
          gh release create "app-v$V" "out/Piano-$V-windows.zip" out/update/Piano.exe out/update/Piano.exe.sig \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Piano $V" --notes-file notes.md --latest
